[project]
name = "research-agent"
version = "0.1.0"
description = "Multi-source research & synthesis agent: consensus, contradictions, single-source claims and gaps with grounded citations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-deepseek>=0.1",
    "httpx>=0.27",
    "tenacity>=8.0",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "rapidfuzz>=3.0",
    "jinja2>=3.1",
    "streamlit>=1.40",
    "playwright>=1.44",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_agent = ["render/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

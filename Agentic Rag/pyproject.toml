[project]
name = "agentic-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "docling>=2.0",
    "tiktoken>=0.7",
    "sentence-transformers>=3.0",
    "tenacity>=8.0",
    "qdrant-client>=1.9",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "structlog>=24.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "python-docx>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "docling>=2.0",
    "tiktoken>=0.7",
    "sentence-transformers>=3.0",
    "tenacity>=8.0",
    "qdrant-client>=1.9",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "structlog>=24.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "python-docx>=1.0",
]
pinecone = [
    "pinecone>=5.0",
]
mysql = [
    "pymysql>=1.1",
    "dbutils>=3.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
ui = [
    "streamlit>=1.35",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

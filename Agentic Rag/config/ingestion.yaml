parser_name: docling

chunking:
  default_strategy: character_v1
  chunk_size_tokens: 512
  chunk_overlap_tokens: 50

embedder:
  name: sentence_transformer
  model_name: BAAI/bge-small-en-v1.5
  batch_size: 32

store:
  name: qdrant
  collection_name: chunks
  path: ./qdrant_storage
  url: null

hash_index_path: ./ingestion_hashes.db
dead_letter_dir: ./dead_letter
